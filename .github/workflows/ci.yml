name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.node-version == '22.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ubuntu-latestランナーはx86_64のため、sharp Lambda LayerはLambdaと
      # 揃えてarm64向けにビルドする（scripts/build-sharp-layer.sh参照）。
      # QEMUエミュレーションが無いと `docker run --platform linux/arm64` が
      # "exec format error" で失敗するため、ここで事前にセットアップする。
      - name: Set up QEMU (for arm64 Docker builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build package
        run: npm run build

      - name: Check build artifacts
        run: |
          test -d dist || (echo "dist directory not found" && exit 1)
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)
          test -f dist/index.d.ts || (echo "dist/index.d.ts not found" && exit 1)
          test -f dist/server/media-process-handler.cjs || (echo "dist/server/media-process-handler.cjs not found" && exit 1)
          test -f dist/server/media-process-handler-dlq.cjs || (echo "dist/server/media-process-handler-dlq.cjs not found" && exit 1)
          test -f dist/server/media-handler.cjs || (echo "dist/server/media-handler.cjs not found" && exit 1)
          test -f dist/sharp-layer.zip || (echo "dist/sharp-layer.zip not found (sharp Lambda Layer build failed)" && exit 1)
          echo "Build artifacts verified successfully"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish]')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up QEMU (for arm64 Docker builds)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build package
        run: npm run build

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --provenance --access public
