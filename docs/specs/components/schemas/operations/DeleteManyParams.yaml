oneOf:
  - type: object
    description: Delete by IDs
    required:
      - ids
    properties:
      ids:
        type: array
        description: Array of record IDs to delete
        items:
          type: string
        example: ['01KETJHF08KEDW320XX6NP2CZ3', '01KETJHF08KEDW320XX6NP2CZ4']

  - type: object
    description: Delete by filter
    required:
      - filter
    properties:
      filter:
        $ref: '../operators/Filter.yaml'
