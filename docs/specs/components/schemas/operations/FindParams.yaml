type: object
description: Parameters for find operation
properties:
  filter:
    $ref: '../Filter.yaml'
  sort:
    type: object
    properties:
      field:
        type: string
        description: Shadow field name to sort by
      order:
        type: string
        enum: [ASC, DESC]
  pagination:
    type: object
    properties:
      perPage:
        type: integer
        minimum: 1
        maximum: 50
        description: Items per page (max 50)
      nextToken:
        type: string
        description: Next page token (Base64URL encoded)
