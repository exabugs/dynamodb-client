type: object
description: エラーレスポンス
properties:
  success:
    type: boolean
    enum: [false]
    description: 常にfalse
  error:
    type: object
    properties:
      code:
        type: string
        description: エラーコード
        example: "VALIDATION_ERROR"
      message:
        type: string
        description: エラーメッセージ
        example: "Invalid document ID"
      details:
        type: object
        description: エラー詳細情報
        additionalProperties: true
    required:
      - code
      - message
required:
  - success
  - error
