type: object
description: 検索オプション
properties:
  sort:
    type: object
    description: ソート条件（値は 1, -1, 'asc', 'desc' のいずれか）
    additionalProperties:
      oneOf:
        - type: number
        - type: string
  limit:
    type: number
    description: 取得件数の制限
    minimum: 1
  skip:
    type: number
    description: スキップする件数
    minimum: 0
  nextToken:
    type: string
    description: ページネーショントークン（カーソルベースのページネーション用）
