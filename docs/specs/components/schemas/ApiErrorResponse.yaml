type: object
required:
  - success
  - error
properties:
  success:
    type: boolean
    enum: [false]
    description: 成功フラグ（常にfalse）
  error:
    type: object
    required:
      - code
      - message
      - statusCode
    properties:
      code:
        type: string
        description: エラーコード
      message:
        type: string
        description: エラーメッセージ
      statusCode:
        type: integer
        description: HTTPステータスコード
      details:
        description: 追加詳細情報（オプション）
description: APIエラーレスポンス
