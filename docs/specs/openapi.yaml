openapi: 3.1.0
info:
  title: DynamoDB Client API
  version: 1.3.34
  description: |
    MongoDB-like API for DynamoDB with shadow record support for efficient querying.
    
    This API provides a familiar MongoDB-style interface for interacting with DynamoDB,
    supporting 10 operations compatible with react-admin.
    
    **Supported Operations:**
    - find: Query documents with filters
    - findOne: Get a single document
    - findMany: Get multiple documents by IDs
    - findManyReference: Get documents by reference field
    - insertOne: Create a single document
    - insertMany: Create multiple documents
    - updateOne: Update a single document
    - updateMany: Update multiple documents
    - deleteOne: Delete a single document
    - deleteMany: Delete multiple documents
  contact:
    name: DynamoDB Client Support
    url: https://github.com/exabugs/dynamodb-client
  license:
    name: MIT
    url: https://github.com/exabugs/dynamodb-client/blob/main/LICENSE

servers:
  - url: '{apiUrl}'
    description: DynamoDB Client API (Lambda Function URL)
    variables:
      apiUrl:
        default: https://your-lambda-url.lambda-url.us-east-1.on.aws
        description: Lambda Function URL

tags:
  - name: Operations
    description: MongoDB-style CRUD operations
  - name: System
    description: System endpoints

paths:
  /version:
    get:
      tags:
        - System
      summary: Get API version
      description: Returns the current API version and timestamp
      operationId: getVersion
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      version:
                        type: string
                        example: "1.3.34"
                      timestamp:
                        type: string
                        format: date-time
  
  /:
    post:
      tags:
        - Operations
      summary: Execute MongoDB-style operation
      description: |
        Execute one of the 10 supported MongoDB-style operations.
        All operations use POST method with operation type in request body.
      operationId: executeOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - op
                - resource
              properties:
                op:
                  type: string
                  enum:
                    - find
                    - findOne
                    - findMany
                    - findManyReference
                    - insertOne
                    - insertMany
                    - updateOne
                    - updateMany
                    - deleteOne
                    - deleteMany
                  description: Operation type
                resource:
                  type: string
                  description: Resource name (collection name)
                  example: "users"
                params:
                  type: object
                  description: Operation-specific parameters
            examples:
              find:
                summary: Find documents
                value:
                  op: find
                  resource: users
                  params:
                    filter: { status: "active" }
                    limit: 10
              findOne:
                summary: Find one document
                value:
                  op: findOne
                  resource: users
                  params:
                    id: "01KETJHF08KEDW320XX6NP2CZ3"
              insertOne:
                summary: Insert one document
                value:
                  op: insertOne
                  resource: users
                  params:
                    data:
                      name: "John Doe"
                      email: "john@example.com"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    description: Operation result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    IAMAuth:
      type: apiKey
      in: header
      name: Authorization
      description: AWS IAM authentication using Signature Version 4
    
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Records Lambda (BFF)

  schemas:
    $ref: './components/schemas/_index.yaml'

security:
  - IAMAuth: []
  - BearerAuth: []
