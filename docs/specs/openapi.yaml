openapi: 3.1.0
info:
  title: DynamoDB Client API
  version: 1.3.34
  description: |
    MongoDB-like API for DynamoDB with shadow record support for efficient querying.
    
    This API provides a familiar MongoDB-style interface for interacting with DynamoDB,
    supporting 10 operations compatible with react-admin.
    
    **Supported Operations:**
    - find: Query documents with filters
    - findOne: Get a single document
    - findMany: Get multiple documents by IDs
    - findManyReference: Get documents by reference field
    - insertOne: Create a single document
    - insertMany: Create multiple documents
    - updateOne: Update a single document
    - updateMany: Update multiple documents
    - deleteOne: Delete a single document
    - deleteMany: Delete multiple documents
  contact:
    name: DynamoDB Client Support
    url: https://github.com/exabugs/dynamodb-client
  license:
    name: MIT
    url: https://github.com/exabugs/dynamodb-client/blob/main/LICENSE

servers:
  - url: '{apiUrl}'
    description: DynamoDB Client API (Lambda Function URL)
    variables:
      apiUrl:
        default: https://your-lambda-url.lambda-url.us-east-1.on.aws
        description: Lambda Function URL

tags:
  - name: Operations
    description: MongoDB-style CRUD operations
  - name: System
    description: System endpoints

paths:
  /version:
    get:
      tags:
        - System
      summary: Get API version
      description: Returns the current API version and timestamp (no authentication required)
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      version:
                        type: string
                        example: "1.3.34"
                      timestamp:
                        type: string
                        format: date-time
  
  /:
    post:
      tags:
        - Operations
      summary: Execute MongoDB-style operation
      description: |
        Execute one of the 10 supported MongoDB-style operations.
        All operations use POST method with operation type in request body.
      operationId: executeOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - op
                - resource
              properties:
                op:
                  type: string
                  enum:
                    - find
                    - findOne
                    - findMany
                    - findManyReference
                    - insertOne
                    - insertMany
                    - updateOne
                    - updateMany
                    - deleteOne
                    - deleteMany
                  description: Operation type
                resource:
                  $ref: '#/components/schemas/ResourceName'
                params:
                  type: object
                  description: Operation-specific parameters
            examples:
              find:
                summary: Find documents with filter and pagination
                description: DynamoDBからレコードを検索します。フィルター、ソート、ページネーションをサポート。
                value:
                  op: find
                  resource: users
                  params:
                    filter: 
                      status: "active"
                      age: { $gte: 18 }
                    sort:
                      field: "createdAt"
                      order: "DESC"
                    pagination:
                      perPage: 10
                      nextToken: "eyJQSyI6InVzZXJzIiwiU0siOiJpZCMwMUtFVEpIRjA4S0VEVzMyMFhYNk5QMkNaMyJ9"
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    filter:
                      type: object
                      description: "フィルター条件（MongoDB形式）。例: { status: \"active\", age: { $gte: 18 } }"
                    sort:
                      type: object
                      description: "ソート条件"
                      properties:
                        field:
                          type: string
                          description: "ソート対象フィールド名"
                        order:
                          type: string
                          enum: [ASC, DESC]
                          description: "ソート順序（ASC: 昇順, DESC: 降順）"
                      required: [field, order]
                    pagination:
                      type: object
                      description: "ページネーション設定"
                      properties:
                        perPage:
                          type: number
                          minimum: 1
                          maximum: 50
                          description: "1ページあたりの件数（最大50件）"
                        nextToken:
                          type: string
                          description: "次ページトークン（前回のレスポンスから取得）"
                  required: [collection]
              
              findOne:
                summary: Find one document by ID
                description: DynamoDBから単一レコードを取得します。IDで指定。
                value:
                  op: findOne
                  resource: users
                  params:
                    id: "01KETJHF08KEDW320XX6NP2CZ3"
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    id:
                      type: string
                      description: "レコードID"
                  required: [collection]
              
              findMany:
                summary: Find multiple documents by IDs
                description: DynamoDBから複数レコードをIDで取得します。
                value:
                  op: findMany
                  resource: users
                  params:
                    ids: ["01KETJHF08KEDW320XX6NP2CZ3", "01KETJHF08KEDW320XX6NP2CZ4"]
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    ids:
                      type: array
                      items:
                        type: string
                      description: "レコードIDの配列"
                  required: [collection, ids]
              
              findManyReference:
                summary: Find documents by reference field
                description: DynamoDBから参照フィールドでレコードを取得します。
                value:
                  op: findManyReference
                  resource: participations
                  params:
                    target: "userId"
                    id: "01KETJHF08KEDW320XX6NP2CZ3"
                    filter:
                      status: "confirmed"
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    target:
                      type: string
                      description: "参照フィールド名（例: userId）"
                    id:
                      type: string
                      description: "参照先のレコードID"
                    filter:
                      type: object
                      description: "フィルター条件（MongoDB形式）"
                  required: [collection, target, id]
              
              insertOne:
                summary: Insert one document
                description: DynamoDBに単一レコードを作成します。
                value:
                  op: insertOne
                  resource: users
                  params:
                    data:
                      name: "John Doe"
                      email: "john@example.com"
                      status: "active"
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    data:
                      type: object
                      description: "作成するデータ"
                  required: [collection, data]
              
              insertMany:
                summary: Insert multiple documents
                description: DynamoDBに複数レコードを作成します。
                value:
                  op: insertMany
                  resource: users
                  params:
                    data:
                      - name: "John Doe"
                        email: "john@example.com"
                      - name: "Jane Smith"
                        email: "jane@example.com"
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    data:
                      type: array
                      items:
                        type: object
                      description: "作成するデータの配列"
                  required: [collection, data]
              
              updateOne:
                summary: Update one document
                description: DynamoDBの単一レコードを更新します。
                value:
                  op: updateOne
                  resource: users
                  params:
                    id: "01KETJHF08KEDW320XX6NP2CZ3"
                    data:
                      status: "inactive"
                      updatedAt: "2024-01-01T00:00:00Z"
                    options:
                      upsert: false
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    id:
                      type: string
                      description: "レコードID"
                    data:
                      type: object
                      description: "更新するデータ"
                    options:
                      type: object
                      description: "操作オプション"
                      properties:
                        upsert:
                          type: boolean
                          description: "レコードが存在しない場合に新規作成するか（デフォルト: false）"
                  required: [collection, id, data]
              
              updateMany:
                summary: Update multiple documents
                description: DynamoDBの複数レコードを更新します。
                value:
                  op: updateMany
                  resource: users
                  params:
                    filter:
                      status: "pending"
                    data:
                      status: "active"
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    filter:
                      type: object
                      description: "フィルター条件（MongoDB形式）"
                    data:
                      type: object
                      description: "更新するデータ"
                  required: [collection, filter, data]
              
              deleteOne:
                summary: Delete one document
                description: DynamoDBから単一レコードを削除します。
                value:
                  op: deleteOne
                  resource: users
                  params:
                    id: "01KETJHF08KEDW320XX6NP2CZ3"
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    id:
                      type: string
                      description: "レコードID"
                  required: [collection, id]
              
              deleteMany:
                summary: Delete multiple documents
                description: DynamoDBから複数レコードを削除します。
                value:
                  op: deleteMany
                  resource: users
                  params:
                    filter:
                      status: "inactive"
                      lastActiveAt: { $lt: "2023-01-01T00:00:00Z" }
                schema:
                  type: object
                  properties:
                    collection:
                      type: string
                      description: "コレクション名（例: venues, users）"
                    filter:
                      type: object
                      description: "フィルター条件（MongoDB形式）"
                  required: [collection, filter]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    description: Operation result
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    IAMAuth:
      type: apiKey
      in: header
      name: Authorization
      description: AWS IAM authentication using Signature Version 4
    
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Records Lambda (BFF)

  schemas:
    $ref: './components/schemas/_index.yaml'

security:
  - IAMAuth: []
  - BearerAuth: []
