post:
  tags:
    - Queries
  summary: 単一ドキュメント検索
  operationId: findOneDocument
  parameters:
    - name: collectionName
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            filter:
              type: object
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              data:
                $ref: '../../components/schemas/Document.yaml'
